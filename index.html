<script>
  // Funciones auxiliares para leer cookies y parámetros de la URL
  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
  }

  function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
  }

  function irAWhatsApp() {
    // 1. Capturar identificadores de Meta en el momento del clic
    const fbp = getCookie('_fbp') || '';
    const fbclid = getQueryParam('fbclid');
    let fbc = '';
    
    if (fbclid) {
      const creationTime = Math.floor(Date.now() / 1000);
      fbc = `fb.1.${creationTime}.${fbclid}`;
    }

    // 2. Guardarlos localmente por si los necesitas registrar luego en tu base de datos
    if (fbp) localStorage.setItem('meta_fbp', fbp);
    if (fbc) localStorage.setItem('meta_fbc', fbc);

    // 3. Disparar evento de conversión 'Lead' con divisa, valor en 0 y test_event_code para pruebas
    if (typeof fbq === 'function') {
      fbq('track', 'Lead', {
        content_name: 'Boton WhatsApp Directo',
        currency: 'ARS',
        value: 0.00,
        fbp: fbp,
        fbc: fbc
      }, {
        test_event_code: 'TEST97429'
      });
    }

    // 4. Número de teléfono configurado
    const numeroUnico = "5492236796945"; 
    
    // 5. Mensaje automático
    let mensaje = "¡Hola! Quiero registrarme en Good Luck y reclamar mi bono del 100%.";
    
    if (fbp) {
      mensaje += ` [Ref: ${fbp}]`;
    }

    const urlFinal = `https://wa.me/${numeroUnico}?text=${encodeURIComponent(mensaje)}`;

    // Espera de 300ms para asegurar el envío del evento antes de redireccionar
    setTimeout(function() {
      window.location.href = urlFinal;
    }, 300);
  }
</script>
